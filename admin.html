<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The創 - 櫃檯管理後台</title>
  <!-- 引入 QR Code 掃描套件 -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f7f5f2; /* 溫馨淺色背景 */
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      background: white;
      width: 100%;
      max-width: 500px;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(141, 110, 99, 0.12);
      padding: 24px;
      box-sizing: border-box;
      border: 1px solid #efebe9;
    }
    h2 {
      color: #5d4037; /* 深咖啡色標題 */
      text-align: center;
      margin-bottom: 20px;
      font-size: 20px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      color: #6d4c41;
      font-size: 14px;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 10px 12px;
      box-sizing: border-box;
      border: 1px solid #d7ccc8;
      border-radius: 8px;
      font-size: 15px;
      background-color: #faf8f6;
      color: #3e2723;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #8d6e63;
      background-color: #fff;
    }
    /* 淺咖啡色掃描按鈕 */
    .scan-btn {
      background-color: #a1887f;
      color: white;
      border: none;
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 10px;
      transition: background 0.2s;
    }
    .scan-btn:hover {
      background-color: #8d6e63;
    }
    #reader {
      width: 100%;
      display: none;
      margin-bottom: 15px;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid #d7ccc8;
    }
    
    /* 加值/扣款切換按鈕群組 */
    .mode-switch {
      display: flex;
      gap: 10px;
      margin-bottom: 6px;
    }
    .mode-btn {
      flex: 1;
      padding: 10px;
      border: 1px solid #d7ccc8;
      border-radius: 8px;
      background-color: #faf8f6;
      color: #6d4c41;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-btn.active-topup {
      background-color: #8d6e63;
      color: white;
      border-color: #8d6e63;
    }
    .mode-btn.active-deduct {
      background-color: #d7ccc8;
      color: #3e2723;
      border-color: #bcaaa4;
    }

    /* 快速金額按鈕 */
    .quick-amounts {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      margin-bottom: 12px;
    }
    .quick-btn {
      flex: 1;
      padding: 6px;
      background-color: #efebe9;
      border: 1px solid #d7ccc8;
      border-radius: 6px;
      color: #5d4037;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
    .quick-btn:hover {
      background-color: #d7ccc8;
    }

    /* 確認送出按鈕（淺咖啡色） */
    button.submit-btn {
      background-color: #6d4c41;
      color: white;
      border: none;
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }
    button.submit-btn:hover {
      background-color: #5d4037;
    }
    button:active {
      opacity: 0.85;
    }
    #resultBox {
      margin-top: 20px;
      padding: 12px;
      background: #faf8f6;
      border: 1px solid #d7ccc8;
      border-radius: 8px;
      display: none;
      font-size: 14px;
      color: #3e2723;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>☕ The創 - 櫃檯會員管理</h2>
    
    <div class="form-group">
      <label>客人的 LINE UID：</label>
      <button class="scan-btn" onclick="startScanner()">📷 掃描客人的 LINE QR Code</button>
      <div id="reader"></div>
      <input type="text" id="uidInput" placeholder="掃描後自動帶入，或手動貼上">
    </div>

    <div class="form-group">
      <label>操作類型：</label>
      <div class="mode-switch">
        <button type="button" id="topupModeBtn" class="mode-btn active-topup" onclick="setMode('topup')">➕ 會員加值</button>
        <button type="button" id="deductModeBtn" class="mode-btn" onclick="setMode('deduct')">➖ 消費扣款</button>
      </div>
      <!-- 快捷金額按鈕 -->
      <div class="quick-amounts" id="quickAmountsContainer">
        <button type="button" class="quick-btn" onclick="setAmount(500)">+500</button>
        <button type="button" class="quick-btn" onclick="setAmount(1000)">+1000</button>
        <button type="button" class="quick-btn" onclick="setAmount(2000)">+2000</button>
      </div>
    </div>

    <div class="form-group">
      <label id="amountLabel">加值金額 (元)：</label>
      <input type="number" id="amountInput" value="500" placeholder="請輸入金額">
    </div>

    <div class="form-group">
      <label>備註說明：</label>
      <input type="text" id="remarkInput" value="櫃檯現金儲值">
    </div>

    <button class="submit-btn" id="submitBtn" onclick="submitBalance()">確認送出加值</button>

    <div id="resultBox"></div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbw34bhpUh__cAb2liixfNKW15-mBUM45M74WxvzYMWesFZHEYtn__Rh1ux3q3JBbKUv/exec";

    let html5QrCode;
    let currentMode = 'topup'; // 'topup' 或 'deduct'

    // 切換加值或扣款模式
    function setMode(mode) {
      currentMode = mode;
      const topupBtn = document.getElementById('topupModeBtn');
      const deductBtn = document.getElementById('deductModeBtn');
      const amountLabel = document.getElementById('amountLabel');
      const remarkInput = document.getElementById('remarkInput');
      const submitBtn = document.getElementById('submitBtn');
      const quickContainer = document.getElementById('quickAmountsContainer');

      if (mode === 'topup') {
        topupBtn.className = "mode-btn active-topup";
        deductBtn.className = "mode-btn";
        amountLabel.innerText = "加值金額 (元)：";
        remarkInput.value = "櫃檯現金儲值";
        submitBtn.innerText = "確認送出加值";
        submitBtn.style.backgroundColor = "#6d4c41";
        quickContainer.style.display = "flex";
        document.getElementById('amountInput').value = "500";
      } else {
        topupBtn.className = "mode-btn";
        deductBtn.className = "mode-btn active-deduct";
        amountLabel.innerText = "扣款金額 (元)：";
        remarkInput.value = "DIY消費扣款"; // 預設備註
        submitBtn.innerText = "確認送出扣款";
        submitBtn.style.backgroundColor = "#8d6e63";
        quickContainer.style.display = "none";
        document.getElementById('amountInput').value = ""; // 金額預設空白
      }
    }

    function setAmount(val) {
      document.getElementById('amountInput').value = val;
    }

    // 啟動相機掃描
    function startScanner() {
      const readerDiv = document.getElementById('reader');
      readerDiv.style.display = 'block';

      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
      }

      html5QrCode.start(
        { facingMode: "environment" },
        {
          fps: 10,
          qrbox: { width: 250, height: 250 }
        },
        (decodedText, decodedResult) => {
          handleScannedData(decodedText);
          html5QrCode.stop().then(() => {
            readerDiv.style.display = 'none';
          }).catch(err => console.error(err));
        },
        (errorMessage) => {}
      ).catch(err => {
        alert("無法開啟相機，請檢查相機權限是否允許！");
        readerDiv.style.display = 'none';
      });
    }

    function handleScannedData(text) {
      document.getElementById('uidInput').value = text;
      alert("成功讀取 QR Code！");
    }

    async function submitBalance() {
      const uid = document.getElementById('uidInput').value.trim();
      const rawAmount = document.getElementById('amountInput').value;
      const remark = document.getElementById('remarkInput').value.trim();

      if (!uid) {
        alert("請先掃描客人的 QR Code 或輸入 UID！");
        return;
      }

      if (rawAmount === "" || isNaN(rawAmount)) {
        alert("請輸入有效的金額！");
        return;
      }

      let amount = parseFloat(rawAmount);
      if (amount < 0) {
        alert("金額不可小於 0！");
        return;
      }

      // 如果是扣款模式，將金額轉為負數傳給後端（若輸入 0 則維持 0）
      if (currentMode === 'deduct') {
        amount = -Math.abs(amount);
      }

      const actionText = currentMode === 'topup' ? '加值' : '扣款';
      if (!confirm(`確定要對此會員執行 ${Math.abs(amount)} 元的${actionText}嗎？`)) {
        return;
      }

      const resultBox = document.getElementById('resultBox');
      resultBox.style.display = 'block';
      resultBox.innerHTML = "處理中...";

      try {
        const url = `${API_URL}?action=updateBalance&uid=${encodeURIComponent(uid)}&amount=${amount}&remark=${encodeURIComponent(remark)}`;
        const response = await fetch(url);
        const textResponse = await response.text();
        
        let result;
        try {
          result = JSON.parse(textResponse);
        } catch (e) {
          throw new Error("後台回傳格式錯誤（請確認 Google Apps Script 部署權限是否設為『任何人』）");
        }

        if (result.success) {
          resultBox.innerHTML = `✅ <b>${actionText}成功！</b><br>會員姓名：${result.name}<br>更新後餘額：<b>${result.newBalance} 元</b>`;
          document.getElementById('uidInput').value = "";
          if (currentMode === 'deduct') {
            document.getElementById('amountInput').value = "";
            document.getElementById('remarkInput').value = "DIY消費扣款";
          }
        } else {
          resultBox.innerHTML = `❌ 失敗：${result.message}`;
        }
      } catch (error) {
        resultBox.innerHTML = `❌ 發生錯誤：${error.message}`;
      }
    }
  </script>

</body>
</html>
