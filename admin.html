<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The創 - 櫃檯管理後台</title>
  <!-- 引入 QR Code 掃描套件 -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f0f2f5;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      background: white;
      width: 100%;
      max-width: 500px;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      padding: 24px;
      box-sizing: border-box;
    }
    h2 {
      color: #333;
      text-align: center;
      margin-bottom: 20px;
      font-size: 20px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      color: #555;
      font-size: 14px;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 10px 12px;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }
    .scan-btn {
      background-color: #00b900;
      color: white;
      border: none;
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 10px;
    }
    #reader {
      width: 100%;
      display: none;
      margin-bottom: 15px;
      border-radius: 8px;
      overflow: hidden;
    }
    button.submit-btn {
      background-color: #06c755;
      color: white;
      border: none;
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    button:active {
      opacity: 0.8;
    }
    #resultBox {
      margin-top: 20px;
      padding: 12px;
      background: #f9f9f9;
      border-radius: 8px;
      display: none;
      font-size: 14px;
      color: #333;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>🌿 The創 - 櫃檯加值管理</h2>
    
    <div class="form-group">
      <label>客人的 LINE UID：</label>
      <button class="scan-btn" onclick="startScanner()">📷 掃描客人的 LINE QR Code</button>
      <div id="reader"></div>
      <input type="text" id="uidInput" placeholder="掃描後自動帶入，或手動貼上">
    </div>

    <div class="form-group">
      <label>操作類型：</label>
      <select id="actionType">
        <option value="500">加值 +500 元</option>
        <option value="1000">加值 +1000 元</option>
        <option value="2000">加值 +2000 元</option>
        <option value="-1">【扣款】消費扣款（請自訂金額）</option>
      </select>
    </div>

    <div class="form-group">
      <label>金額 (元)：</label>
      <input type="number" id="amountInput" value="500">
    </div>

    <div class="form-group">
      <label>備註說明：</label>
      <input type="text" id="remarkInput" value="櫃檯現金儲值">
    </div>

    <button class="submit-btn" onclick="submitBalance()">確認送出加值/扣款</button>

    <div id="resultBox"></div>
  </div>

  <script>
    // 請確認這裡填入妳目前最新的 Apps Script 部署網址
    const API_URL = "https://script.google.com/macros/s/AKfycbw3McIIaMCQl2RHeKTuV5zAMhzFk7LTM7oSSiM2S1jAYu4tFwsL28tWPLMu-iK7WHbo/exec";

    let html5QrCode;

    // 啟動相機掃描
    function startScanner() {
      const readerDiv = document.getElementById('reader');
      readerDiv.style.display = 'block';

      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
      }

      html5QrCode.start(
        { facingMode: "environment" }, // 使用後置鏡頭
        {
          fps: 10,
          qrbox: { width: 250, height: 250 }
        },
        (decodedText, decodedResult) => {
          // 成功掃描到 QR Code
          handleScannedData(decodedText);
          // 停止相機並隱藏框框
          html5QrCode.stop().then(() => {
            readerDiv.style.display = 'none';
          }).catch(err => console.error(err));
        },
        (errorMessage) => {
          // 掃描中（未對準時不用理會錯誤）
        }
      ).catch(err => {
        alert("無法開啟相機，請檢查相機權限是否允許！");
        readerDiv.style.display = 'none';
      });
    }

    // 解析掃描到的內容
    function handleScannedData(text) {
      // LINE 個人 QR Code 格式通常是 https://line.me/ti/p/xxxx 或其他結構
      // 也有可能是直接存 UID 或好友連結
      // 這裡我們直接把掃到的文字填進 UID 欄位（如果客人是掃加好友或個人網址，後續我們可以對應，
      // 但最準確的是直接抓取該網址或讓客人出示會員中心裡的 UID）
      // 💡 註：LINE 個人 QR Code 內含的是對應的網址。
      // 為了最保險，我們也可以直接把掃到的整串網址或文字帶進去，
      // 如果後端希望直接收 UID，我們可以在這裡做簡單處理，或是請客人直接掃我們專屬的綁定頁面。
      
      document.getElementById('uidInput').value = text;
      alert("成功讀取 QR Code！");
    }

    // 當下拉選單改變時自動填入金額
    document.getElementById('actionType').addEventListener('change', function() {
      const val = this.value;
      if (val !== "-1") {
        document.getElementById('amountInput').value = val;
        document.getElementById('remarkInput').value = "櫃檯現金儲值";
      } else {
        document.getElementById('amountInput').value = "";
        document.getElementById('remarkInput').value = "DIY 消費扣款";
      }
    });

    async function submitBalance() {
      const uid = document.getElementById('uidInput').value.trim();
      let amount = parseInt(document.getElementById('amountInput').value);
      const remark = document.getElementById('remarkInput').value.trim();
      const actionType = document.getElementById('actionType').value;

      if (!uid) {
        alert("請先掃描客人的 QR Code 或輸入 UID！");
        return;
      }
      if (isNaN(amount) || amount <= 0) {
        alert("請輸入有效的金額！");
        return;
      }

      if (actionType === "-1") {
        amount = -Math.abs(amount);
      }

      if (!confirm(`確定要執行此筆金額變動嗎？`)) {
        return;
      }

      const resultBox = document.getElementById('resultBox');
      resultBox.style.display = 'block';
      resultBox.innerHTML = "處理中...";

      try {
        const url = `${API_URL}?action=updateBalance&uid=${encodeURIComponent(uid)}&amount=${amount}&remark=${encodeURIComponent(remark)}`;
        const response = await fetch(url);
        const result = await response.json();

        if (result.success) {
          resultBox.innerHTML = `✅ <b>操作成功！</b><br>會員姓名：${result.name}<br>更新後餘額：<b>${result.newBalance} 元</b>`;
          document.getElementById('uidInput').value = "";
        } else {
          resultBox.innerHTML = `❌ 失敗：${result.message}`;
        }
      } catch (error) {
        resultBox.innerHTML = `❌ 發生錯誤：${error.message}`;
      }
    }
  </script>

</body>
</html>
