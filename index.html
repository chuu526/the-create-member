<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The創 - 會員專區</title>
  <script src="https://static.line-scdn.net/liff/2/sdk.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #fcf9f5; /* 溫馨極淺米色背景 */
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      color: #3e2723;
    }
    .container {
      background: white;
      width: 100%;
      max-width: 480px;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(141, 110, 99, 0.1);
      padding: 24px;
      box-sizing: border-box;
      border: 1px solid #efebe9;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header h2 {
      color: #5d4037;
      margin: 0 0 4px 0;
      font-size: 22px;
    }
    .header p {
      color: #8d6e63;
      margin: 0;
      font-size: 13px;
    }
    
    /* 會員資訊卡片（淺黃/奶油色系） */
    .card {
      background: linear-gradient(135deg, #fffcf0 0% #fff8e1 100%);
      border: 1px solid #ffe082;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(255, 193, 7, 0.1);
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 15px;
    }
    .info-row:last-child {
      margin-bottom: 0;
    }
    .label {
      color: #795548;
      font-weight: bold;
    }
    .value {
      color: #4e342e;
      font-weight: 500;
    }
    .highlight-balance {
      color: #d84315;
      font-weight: bold;
      font-size: 18px;
    }

    /* 生日區塊 */
    .birthday-section {
      background: #faf8f6;
      border: 1px solid #d7ccc8;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
      text-align: center;
    }
    .birthday-section input {
      padding: 8px 10px;
      border: 1px solid #bcaaa4;
      border-radius: 8px;
      font-size: 14px;
      margin-right: 6px;
      background: #fff;
      color: #3e2723;
    }

    /* 按鈕樣式（淺咖啡色） */
    .btn {
      background-color: #8d6e63;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover {
      background-color: #6d4c41;
    }

    /* QR Code 區塊 */
    .qr-container {
      background: #faf8f6;
      border: 1px solid #d7ccc8;
      border-radius: 14px;
      padding: 16px;
      text-align: center;
      margin-bottom: 16px;
    }
    .qr-container h3 {
      margin: 0 0 10px 0;
      font-size: 15px;
      color: #5d4037;
    }
    #qrcode {
      display: inline-block;
      padding: 10px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    /* 交易紀錄區塊 */
    .history-section h3 {
      font-size: 16px;
      color: #5d4037;
      border-bottom: 2px solid #efebe9;
      padding-bottom: 6px;
      margin-bottom: 10px;
    }
    .history-list {
      max-height: 200px;
      overflow-y: auto;
    }
    .history-item {
      background: #faf8f6;
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .history-info .time {
      color: #8d6e63;
      font-size: 11px;
    }
    .history-info .remark {
      color: #4e342e;
      font-weight: bold;
      margin-top: 2px;
    }
    .history-amount {
      font-weight: bold;
      font-size: 14px;
    }
    .amount-plus {
      color: #2e7d32;
    }
    .amount-minus {
      color: #c62828;
    }

    #loading {
      text-align: center;
      color: #8d6e63;
      font-weight: bold;
      padding: 20px;
    }
  </style>
  <!-- 引入 qrious 套件用來產生 QR Code -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/min/qrious.min.js"></script>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2>🌿 The創 - 會員專區</h2>
      <p>歡迎來到您的專屬會員中心</p>
    </div>

    <div id="loading">載入會員資料中，請稍候...</div>

    <div id="memberContent" style="display: none;">
      <!-- 會員資訊卡片 -->
      <div class="card">
        <div class="info-row">
          <span class="label">會員姓名：</span>
          <span class="value" id="userName">-</span>
        </div>
        <div class="info-row">
          <span class="label">會員等級：</span>
          <span class="value" id="userLevel">-</span>
        </div>
        <div class="info-row">
          <span class="label">儲值金餘額：</span>
          <span class="value highlight-balance" id="userBalance">0 元</span>
        </div>
      </div>

      <!-- 生日設定區塊 -->
      <div class="birthday-section" id="birthdayBox">
        <div style="font-size: 14px; font-weight: bold; color: #5d4037; margin-bottom: 6px;">🎂 生日優惠設定</div>
        <div id="birthdayDisplay" style="font-size: 13px; color: #6d4c41; margin-bottom: 8px;">-</div>
        <div id="birthdayInputArea">
          <input type="date" id="birthdayInput">
          <button class="btn" onclick="saveBirthday()">儲存生日</button>
        </div>
      </div>

      <!-- 會員 QR Code 區塊 -->
      <div class="qr-container">
        <h3>📱 結帳 / 櫃檯辨識專用 QR Code</h3>
        <p style="font-size: 11px; color: #8d6e63; margin: 0 0 8px 0;">結帳或加值時出示此條碼給店員掃描</p>
        <div>
          <canvas id="qrcode"></canvas>
        </div>
      </div>

      <!-- 消費與儲值紀錄 -->
      <div class="history-section">
        <h3>📜 近期交易紀錄</h3>
        <div class="history-list" id="historyList">
          <!-- 動態插入紀錄 -->
        </div>
      </div>
    </div>
  </div>

  <script>
    // 請確認這裡填入妳目前最新的 Apps Script 部署網址
    const API_URL = "https://script.google.com/macros/s/AKfycbw34bhpUh__cAb2liixfNKW15-mBUM45M74WxvzYMWesFZHEYtn__Rh1ux3q3JBbKUv/exec";
    
    // 填入妳的 LIFF ID (如果有的話，若無則會自動用模擬測試或直接從網址列抓 UID)
    const LIFF_ID = "YOUR_LIFF_ID"; 

    let currentUid = "";

    window.onload = async function() {
      try {
        // 初始化 LIFF 取得使用者 UID
        if (typeof liff !== 'undefined' && LIFF_ID !== "YOUR_LIFF_ID") {
          await liff.init({ liffId: LIFF_ID });
          if (!liff.isLoggedIn()) {
            liff.login();
            return;
          }
          const profile = await liff.getProfile();
          currentUid = profile.userId;
          fetchMemberData(currentUid, profile.displayName);
        } else {
          // 開發測試用：如果沒有開 LIFF，可以從網址列 ?uid=xxx 測試，或是給預設測試 UID
          const urlParams = new URLSearchParams(window.location.search);
          currentUid = urlParams.get('uid') || "TEST_UID_001";
          const testName = urlParams.get('name') || "測試會員";
          fetchMemberData(currentUid, testName);
        }
      } catch (error) {
        document.getElementById('loading').innerHTML = "載入失敗：" + error.message;
      }
    };

    async function fetchMemberData(uid, name) {
      try {
        const url = `${API_URL}?action=getMemberAll&uid=${encodeURIComponent(uid)}&name=${encodeURIComponent(name)}`;
        const response = await fetch(url);
        const data = await response.json();

        if (data.success) {
          document.getElementById('loading').style.display = 'none';
          document.getElementById('memberContent').style.display = 'block';

          document.getElementById('userName').innerText = data.name;
          document.getElementById('userLevel').innerText = data.level;
          document.getElementById('userBalance').innerText = data.diyBalance.toLocaleString() + " 元";

          // 處理生日顯示
          const birthdayBox = document.getElementById('birthdayDisplay');
          const inputArea = document.getElementById('birthdayInputArea');
          if (data.birthday) {
            birthdayBox.innerHTML = `🎁 您的生日：<b>${data.birthday}</b> (${data.birthdayBenefit})`;
            inputArea.style.display = 'none'; // 設定過就隱藏輸入框
          } else {
            birthdayBox.innerHTML = `🎁 尚未設定生日（設定後當月壽星享專屬優惠！）`;
            inputArea.style.display = 'block';
          }

          // 產生 QR Code (將 UID 轉換為 QR Code 讓櫃檯掃描)
          new QRious({
            element: document.getElementById('qrcode'),
            value: uid,
            size: 160,
            level: 'H',
            background: '#ffffff',
            foreground: '#4e342e'
          });

          // 渲染歷史紀錄
          const historyList = document.getElementById('historyList');
          historyList.innerHTML = "";
          if (data.history && data.history.length > 0) {
            data.history.forEach(item => {
              const isPlus = item.amount >= 0;
              const amountStr = (isPlus ? "+" : "") + item.amount.toLocaleString();
              const amountClass = isPlus ? "amount-plus" : "amount-minus";

              const div = document.createElement('div');
              div.className = "history-item";
              div.innerHTML = `
                <div class="history-info">
                  <div class="time">${item.time}</div>
                  <div class="remark">${item.remark}</div>
                </div>
                <div class="history-amount ${amountClass}">${amountStr} 元</div>
              `;
              historyList.appendChild(div);
            });
          } else {
            historyList.innerHTML = `<div style="text-align: center; color: #8d6e63; font-size: 13px; padding: 10px;">目前尚無交易紀錄</div>`;
          }

        } else {
          document.getElementById('loading').innerHTML = "無法取得會員資料：" + data.message;
        }
      } catch (err) {
        document.getElementById('loading').innerHTML = "連線發生錯誤：" + err.message;
      }
    }

    async function saveBirthday() {
      const birthday = document.getElementById('birthdayInput').value;
      if (!birthday) {
        alert("請選擇您的生日日期！");
        return;
      }

      if (!confirm(`確定生日為 ${birthday} 嗎？設定後將無法自行修改喔！`)) {
        return;
      }

      try {
        const url = `${API_URL}?action=updateBirthday&uid=${encodeURIComponent(currentUid)}&birthday=${encodeURIComponent(birthday)}`;
        const res = await fetch(url);
        const result = await res.json();

        if (result.success) {
          alert("生日設定成功！");
          location.reload(); // 重新整理頁面更新狀態
        } else {
          alert("設定失敗：" + result.message);
        }
      } catch (e) {
        alert("發生錯誤：" + e.message);
      }
    }
  </script>

</body>
</html>
